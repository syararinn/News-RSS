<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多角ニュース収集アプリ</title>
  <style>
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --border: #e2e0d8; --text: #1a1a18;
      --muted: #6b6b66; --accent: #1a5c38; --accent-light: #e8f2ec;
      --accent-mid: #2d7a4f; --tag-bg: #eef7f2; --tag-border: #b5d9c5;
      --tag-text: #1a5c38; --row-hover: #f9f8f5; --link: #1a5c38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding-bottom: 4rem; }
    header { background: var(--accent); color: #fff; padding: 1.25rem 1.5rem; }
    header h1 { font-size: 1.1rem; }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* タブデザイン */
    .tabs { display: flex; gap: 5px; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); overflow-x: auto; }
    .tab-btn {
      background: none; border: none; font-size: 0.85rem; font-weight: 600;
      color: var(--muted); cursor: pointer; padding: 10px 12px; white-space: nowrap;
    }
    .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: var(--accent-light); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .card-title { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 0.75rem; }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.75rem; }
    .chip { background: var(--tag-bg); color: var(--tag-text); border: 1px solid var(--tag-border); font-size: 0.75rem; padding: 3px 8px; border-radius: 15px; }
    .chip-del { background: none; border: none; margin-left: 4px; cursor: pointer; color: var(--tag-text); }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.9rem; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
    .btn:disabled { opacity: 0.5; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: #eee; margin-left: auto; }
    
    /* table */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead th { background: #f9f8f5; padding: 10px; text-align: left; border-bottom: 1px solid var(--border); color: var(--muted); }
    tbody td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .kw-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background: var(--tag-bg); color: var(--tag-text); border: 1px solid var(--tag-border); white-space: nowrap; }
    .date-cell { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .open-link { color: var(--link); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <h1>📰 政治・地域ニュース収集</h1>
</header>

<main>
  <div class="tabs">
    <button id="tab-news" class="tab-btn active" onclick="switchTab('news')">🔍 ニュース検索</button>
    <button id="tab-major" class="tab-btn" onclick="switchTab('major')">🌍 主要ニュース</button>
    <button id="tab-social" class="tab-btn" onclick="switchTab('social')">📝 ブログ・コラム</button>
  </div>

  <div class="card">
    <p class="card-title">共通検索キーワード</p>
    <div id="chips"></div>
    <div class="add-row">
      <input type="text" id="kw-input" placeholder="キーワードを追加..." />
      <button class="btn" onclick="addKeyword()" style="background:#6b6b66;">＋</button>
    </div>
  </div>

  <div id="panel-news" class="tab-panel">
    <div class="controls">
      <select id="count-news"><option value="5">5件</option><option value="10" selected>10件</option></select>
      <div id="st-news" class="status-badge">待機中</div>
      <button class="btn" onclick="fetchData('news')">ニュースを取得</button>
    </div>
  </div>

  <div id="panel-major" class="tab-panel" style="display:none">
    <div class="controls">
      <span style="font-size:0.75rem; color:var(--muted)">Yahoo!/NHKの主要トピックス</span>
      <div id="st-major" class="status-badge">待機中</div>
      <button class="btn" onclick="fetchData('major')">主要ニュース取得</button>
    </div>
  </div>

  <div id="panel-social" class="tab-panel" style="display:none">
    <div class="controls">
      <select id="count-social"><option value="5" selected>5件</option><option value="10">10件</option></select>
      <div id="st-social" class="status-badge">待機中</div>
      <button class="btn" onclick="fetchData('social')" style="background:#2d7a4f">ブログ・コラム取得</button>
    </div>
  </div>

  <div id="results"></div>
</main>

<script>
let keywords = ["公明党","中道","立憲","自民党","国会","麻生区","稲城市","ドローン","新百合ヶ丘"];
let dataStore = { news: [], major: [], social: [] };
let currentTab = 'news';

function switchTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('panel-'+t).style.display = 'block';
  renderTable();
}

function renderChips() {
  document.getElementById('chips').innerHTML = keywords.map((k, i) =>
    `<span class="chip">${k}<button class="chip-del" onclick="removeKw(${i})">×</button></span>`
  ).join('');
}
function addKeyword() {
  const v = document.getElementById('kw-input').value.trim();
  if (v && !keywords.includes(v)) { keywords.push(v); renderChips(); }
  document.getElementById('kw-input').value = '';
}
function removeKw(i) { keywords.splice(i,1); renderChips(); }

async function fetchData(type) {
  const stId = 'st-' + type;
  const count = document.getElementById('count-' + (type==='major'?'news':type))?.value || 10;
  dataStore[type] = [];
  document.getElementById('results').innerHTML = '<p style="text-align:center;padding:2rem;color:#6b6b66;">取得中...</p>';
  
  const targetKws = (type === 'major') ? ['___MAJOR___'] : keywords;
  
  for (let i = 0; i < targetKws.length; i++) {
    document.getElementById(stId).textContent = (type==='major'?'取得中':`${i+1}/${targetKws.length}`);
    try {
      const url = `https://monumental-piroshki-d8aafb.netlify.app/.netlify/functions/rss?keyword=${encodeURIComponent(targetKws[i])}&count=${count}&type=${type}`;
      const res = await fetch(url);
      const items = await res.json();
      dataStore[type].push(...items.map(item => ({...item, dt: new Date(item.published || 0)})));
    } catch(e) {}
    if (targetKws.length > 1) await new Promise(r => setTimeout(r, 500));
  }
  document.getElementById(stId).textContent = dataStore[type].length + '件完了';
  document.getElementById(stId).style.background = '#e8f2ec';
  renderTable();
}

function renderTable() {
  const data = dataStore[currentTab];
  if (!data || data.length === 0) {
    document.getElementById('results').innerHTML = '<p style="text-align:center;padding:3rem;color:#6b6b66;">データがありません。「取得」を押してください。</p>';
    return;
  }
  
  const sorted = [...data].sort((a,b) => b.dt - a.dt);
  const rows = sorted.map(n => {
    const dateStr = n.dt.getFullYear() > 2000 ? n.dt.toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '不明';
    return `<tr>
      <td><span class="kw-tag">${n.keyword}</span></td>
      <td><div style="line-height:1.4">${n.title}</div></td>
      <td class="date-cell">${dateStr}</td>
      <td><a class="open-link" href="${n.link}" target="_blank">開く</a></td>
    </tr>`;
  }).join('');

  document.getElementById('results').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>出典</th><th>タイトル</th><th>日時</th><th>リンク</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

renderChips();
</script>
</body>
</html>
